# Web3 Monitor Configuration

# Discord Webhook Settings
discord:
  enabled: true  # 是否启用 Discord 推送 (false 则仅采集保存)
  webhook_url: "YOUR_DISCORD_WEBHOOK_URL_HERE"
  username: "Web3 Monitor"
  avatar_url: ""
  footer: "Power By 东方隐侠安全团队·Anonymous@ 隐侠安全客栈"

# General Settings
settings:
  save_images: true
  image_dir: "./downloads"
  markdown_dir: "./output"  # Markdown 输出目录
  history_file: "processed_ids.json"
  database: "data.db"
  headless: true
  timeout: 60000



# Site Configurations
sites:
  blockbeats:
    enabled: true
    interval: 300 # seconds
    categories:
      - name: "预测市场"
        type: 1
      - name: "链上侦探"
        type: 2
      - name: "融资"
        type: 3

  techflow:
    enabled: true
    interval: 300
    is_hot: true # 只采集精选
    categories:
      - name: "AI前沿"
        id: 1005
      - name: "加密股票"
        id: 1004
      - name: "项目动态"
        id: 1003
      - name: "市场观点"
        id: 1002
      - name: "链上数据"
        id: 1001
      - name: "融资动态"
        id: 1000

  rootdata:
    enabled: true
    interval: 3600 # 数据聚合频率较低
    list_tasks:
      - name: "Top 100 项目"
        url: "https://cn.rootdata.com/rootdatalist/2025/top-projects"
      - name: "透明度评分提升榜"
        url: "https://cn.rootdata.com/rankings/transparency"
      - name: "交易所透明度排名"
        url: "https://cn.rootdata.com/exchanges/ranking"
    
    calendar:
      enabled: true
      url: "https://cn.rootdata.com/calendar"
      insight_enabled: true # 未来7天加密日历洞察
    
    market:
      enabled: true
      url: "https://cn.rootdata.com/Market"

